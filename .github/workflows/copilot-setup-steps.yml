name: Copilot Setup Steps

# Pre-builds the environment so Copilot coding agents can run the build and test
# commands immediately (mirrors .github/workflows/test.yml toolchain).

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17 (Temurin) with Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Warm Maven dependencies
        working-directory: backend
        run: mvn -B -q -DskipTests dependency:go-offline

      - name: Set up Node with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies from lockfile
        working-directory: frontend
        run: npm ci